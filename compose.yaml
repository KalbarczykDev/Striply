services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: striply
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - striply_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d striply"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  striply_postgres_data: